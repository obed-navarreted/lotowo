<header class="page-header">
  <div class="page-header__copy">
    <span class="eyebrow">Seguridad de la cuenta</span>
    <h1>Cambiar contraseña</h1>
    <p class="page-subtitle">Elige una contraseña personal de al menos 5 caracteres.</p>
  </div>
</header>

<section class="password-card card">
  @if (auth.user()?.mustChangePassword) {
    <div class="required-note">
      <lo-icon name="lock" [size]="19" /><span
        ><strong>Cambio obligatorio en el primer ingreso</strong>La contraseña temporal debe
        reemplazarse antes de utilizar la aplicación.</span
      >
    </div>
  }
  <form (submit)="$event.preventDefault(); save()">
    <label
      ><span>Contraseña actual</span
      ><input
        class="input"
        [type]="showPasswords() ? 'text' : 'password'"
        [(ngModel)]="currentPassword"
        name="currentPassword"
        autocomplete="current-password"
        required
    /></label>
    <label
      ><span>Nueva contraseña</span
      ><input
        class="input"
        [type]="showPasswords() ? 'text' : 'password'"
        [(ngModel)]="newPassword"
        name="newPassword"
        minlength="5"
        maxlength="72"
        autocomplete="new-password"
        required
      /><small>Mínimo 5 caracteres.</small></label
    >
    <label
      ><span>Confirmar nueva contraseña</span
      ><input
        class="input"
        [type]="showPasswords() ? 'text' : 'password'"
        [(ngModel)]="confirmation"
        name="confirmation"
        minlength="5"
        maxlength="72"
        autocomplete="new-password"
        required
    /></label>
    <label class="show-passwords"
      ><input
        type="checkbox"
        [checked]="showPasswords()"
        (change)="showPasswords.set($any($event.target).checked)"
      />
      Mostrar contraseñas</label
    >
    @if (error()) {
      <div class="password-error">{{ error() }}</div>
    }
    <button class="button button--primary button--block" type="submit" [disabled]="saving()">
      {{ saving() ? 'Actualizando…' : 'Guardar nueva contraseña' }}
    </button>
  </form>
</section>
